# Thin wrapper -- the real config is pulled from GitHub at build time, so
# every push (dashboard or HA app) always builds the current repo config.
# Do not edit here: edit ac-a5-control-c6.yaml in zxPILEDRIVERxz/ac-a5-node.
packages:
  ac_node:
    url: https://github.com/zxPILEDRIVERxz/ac-a5-node
    username: zxPILEDRIVERxz
    password: !secret ac_a5_listen__github_token
    files: [ac-a5-control-c6.yaml]
    # Default package cache is 1 day -- that would let a push build with
    # yesterday's config. Always re-fetch so every build is the repo HEAD.
    refresh: always
